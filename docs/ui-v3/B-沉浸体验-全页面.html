<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0B0E14;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;color:#E8ECF4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1300px;margin:0 auto;padding:36px 24px 72px}
.hd h1{font-size:26px;letter-spacing:-.3px}

.hd p{font-size:13px;color:#8A94A8;margin-top:8px;line-height:1.75;max-width:900px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 30px}

.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px}
.shot{background:#141922;border:1px solid #232A38;border-radius:14px;padding:16px 16px 14px}
.cap{font-size:13px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.cap b{background:linear-gradient(135deg,#FF6B4A,#FF3B30);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px}
.note{font-size:11px;color:#8A94A8;line-height:1.65;margin:0 0 12px}
.phonebox{display:flex;justify-content:center}

.phone{width:375px;height:780px;border-radius:26px;overflow:hidden;position:relative;background:#0B0E14;
  box-shadow:0 10px 34px rgba(0,0,0,.55);border:1px solid #2A3240;display:flex;flex-direction:column}
.sb{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font-size:12px;font-weight:600;background:#0B0E14;color:#E8ECF4}
.sb .r{display:flex;align-items:center;gap:5px}
.nb{height:44px;flex:0 0 44px;background:#0B0E14;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;border-bottom:1px solid #1B2130}
.nb .bk{position:absolute;left:12px;top:10px;width:24px;height:24px}
.nb .rt{position:absolute;right:12px;top:12px;font-size:13px;font-weight:500;color:#8A94A8}
.body{flex:1;overflow:hidden;position:relative;background:#0B0E14}
.tb{height:56px;flex:0 0 56px;background:#0F131B;border-top:1px solid #1B2130;display:flex}
.tb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#5C6679}
.tb div.on{color:#FF5A5F;font-weight:600}
.hm{height:34px;flex:0 0 34px;background:#0F131B;display:flex;align-items:center;justify-content:center}
.hm i{width:134px;height:5px;border-radius:3px;background:#4A5468;display:block}

.pad{padding:12px 14px}
.card{background:#141922;border:1px solid #232A38;border-radius:16px}
.row{display:flex;align-items:center}
.btw{display:flex;align-items:center;justify-content:space-between}
.t1{font-size:14px;color:#E8ECF4}
.t2{font-size:12px;color:#8A94A8}
.t3{font-size:11px;color:#5C6679}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:#FF5A5F}.down{color:#12D18A}
.b{font-weight:600}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tag{font-size:10px;line-height:1;padding:3px 6px;border-radius:5px;font-weight:600;white-space:nowrap}
.t-30{background:linear-gradient(135deg,#FF3B30,#C0271E);color:#fff}
.t-10{background:linear-gradient(135deg,#FF6B4A,#E0501F);color:#fff}
.t-same{background:linear-gradient(135deg,#FFA53C,#E8890C);color:#241503}
.t-ord{background:linear-gradient(135deg,#FFC94A,#B8860B);color:#241503}
.t-safe{background:linear-gradient(135deg,#17D1A0,#0E9F6E);color:#04241A}
.t-unk{background:#2A3240;color:#8A94A8}
.t-gy{background:#1B212C;color:#8A94A8}
.t-st{background:transparent;color:#FF5A5F;border:1px solid #FF5A5F}
.seg{display:flex;background:#1B212C;border-radius:10px;padding:3px}
.seg span{flex:1;text-align:center;font-size:13px;padding:6px 0;color:#8A94A8;border-radius:8px}
.seg span.on{background:#2A3240;color:#E8ECF4;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.chips{display:flex;gap:6px;overflow:hidden}
.chip{font-size:11px;padding:5px 10px;border:1px solid #2A3240;border-radius:20px;color:#8A94A8;background:#141922;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#FF6B4A,#FF3B30);color:#fff;border-color:transparent}
.bar{height:6px;background:#1B212C;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.hr{height:1px;background:#232A38}
.disc{font-size:10px;color:#5C6679;text-align:center;line-height:1.6;padding:8px 0}
.btn{background:linear-gradient(135deg,#FF6B4A,#FF3B30);color:#fff;font-size:13px;border-radius:10px;padding:8px 14px;font-weight:600}
.btn.gh{background:#1B212C;color:#E8ECF4;border:1px solid #2A3240}
.fade{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(180deg,rgba(11,14,20,0),rgba(11,14,20,.96))}
input.f{background:#1B212C;border:1px solid #2A3240;border-radius:8px;font-size:12px;padding:0 8px;height:30px;color:#E8ECF4;text-align:right;font-variant-numeric:tabular-nums;width:100%}
input.f.err{border-color:#FF3B30;background:#2A1518}
.glow{box-shadow:0 0 28px rgba(255,59,48,.28)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1><em>方案 B</em>沉浸体验 · 暗色雷达</h1>
    <p>深色底 + 大字号 + 图形化风险仪表：把「距离阈值还差多少」做成一个可一眼读懂的环形仪表与光晕，弱化表格、强化情绪与风险感知。面向需要快速判断「这只票现在危不危险」的用户。代价是信息密度下降、开发需自定义绘制组件。</p>
  </div>
  <div class="legend">
    <span><i style="background:linear-gradient(135deg,#FF3B30,#C0271E)"></i>30 日严重异常</span>
    <span><i style="background:linear-gradient(135deg,#FF6B4A,#E0501F)"></i>10 日严重异常</span>
    <span><i style="background:linear-gradient(135deg,#FFA53C,#E8890C)"></i>同向严重异常</span>
    <span><i style="background:linear-gradient(135deg,#FFC94A,#B8860B)"></i>普通风险提示</span>
    <span><i style="background:linear-gradient(135deg,#17D1A0,#0E9F6E)"></i>安全</span>
    <span><i style="background:#2A3240"></i>数据不可判定</span>
    <span><i style="background:#FF5A5F"></i>涨（红）</span>
    <span><i style="background:#12D18A"></i>跌（绿）</span>
  </div>

  <div class="grid">

  <!-- B1 -->
  <figure class="shot">
    <div class="cap"><b>B1</b>单股计算 · 搜索联想</div>
    <p class="note">深色浮层 + 高亮命中片段；命中代码前缀用品牌橙描边，ST 用红色虚框。浮层带毛玻璃底与外发光，与浅色版同样只显示 5 条 + 「继续输入」提示。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#E8ECF4"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#E8ECF4"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#E8ECF4"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#5C6679"/></svg>
        <svg width="16" height="11"><rect x="0" y="2" width="13" height="7" rx="2" fill="none" stroke="#E8ECF4"/><rect x="1.5" y="3.5" width="9" height="4" rx="1" fill="#E8ECF4"/><rect x="14.5" y="4" width="1.5" height="3" rx=".5" fill="#E8ECF4"/></svg>
      </span></div>
      <div class="nb">单股计算<span class="rt">规则</span></div>
      <div class="body">
        <div style="padding:10px 14px">
          <div class="row" style="background:#141922;border:1px solid #FF6B4A;border-radius:12px;height:40px;padding:0 12px;gap:8px;box-shadow:0 0 18px rgba(255,107,74,.18)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A94A8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span style="font-size:15px" class="b">0025</span>
            <span style="width:1px;height:15px;background:#FF6B4A;display:inline-block"></span>
            <span class="t3" style="flex:1">输入代码 / 名称 / 简称</span>
          </div>
        </div>
        <div style="margin:0 14px;background:#141922;border:1px solid #2A3240;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.55);overflow:hidden">
          <div class="row" style="padding:11px 12px;border-bottom:1px solid #232A38;gap:7px">
            <span class="b" style="font-size:14px">比亚迪</span><span class="tag t-gy mono" style="border:1px solid #FF6B4A;color:#FF8A66">002594</span><span class="t3">深交所 · 主板</span>
          </div>
          <div class="row" style="padding:11px 12px;border-bottom:1px solid #232A38;gap:7px">
            <span class="b" style="font-size:14px">通达股份</span><span class="tag t-gy mono">002560</span><span class="t3">深交所 · 主板</span>
          </div>
          <div class="row" style="padding:11px 12px;border-bottom:1px solid #232A38;gap:7px">
            <span class="b" style="font-size:14px">顺灏股份</span><span class="tag t-gy mono">002565</span><span class="t3">深交所 · 主板</span>
          </div>
          <div class="row" style="padding:11px 12px;border-bottom:1px solid #232A38;gap:7px">
            <span class="b" style="font-size:14px">融钰集团</span><span class="tag t-gy mono">002622</span><span class="t3">深交所 · 主板</span>
          </div>
          <div class="row" style="padding:11px 12px;gap:7px">
            <span class="b" style="font-size:14px">ST 摩登</span><span class="tag t-st">ST</span><span class="tag t-gy mono">002656</span><span class="t3">深交所 · 主板</span>
          </div>
          <div style="padding:8px 12px;background:#10141C;font-size:11px;color:#5C6679;border-top:1px solid #232A38">继续输入以缩小范围</div>
        </div>
        <div class="pad">
          <div style="text-align:center;padding:40px 20px">
            <svg width="96" height="96" viewBox="0 0 96 96" style="opacity:.9">
              <circle cx="48" cy="48" r="40" fill="none" stroke="#1B212C" stroke-width="6"/>
              <circle cx="48" cy="48" r="26" fill="none" stroke="#1B212C" stroke-width="4"/>
              <circle cx="48" cy="48" r="12" fill="none" stroke="#232A38" stroke-width="3"/>
              <path d="M48 48L82 34" stroke="#FF6B4A" stroke-width="3" stroke-linecap="round" opacity=".7"/>
            </svg>
            <div style="font-size:15px;font-weight:600;margin-top:14px">搜索一只 A 股开始</div>
            <div class="t3" style="margin-top:6px;line-height:1.7">选中后为你计算当前状态、四项预警<br>与 T+1 ~ T+10 假设推演</div>
          </div>
        </div>
        <div class="disc">仅供参考，不构成投资建议</div>
      </div>
      <div class="tb">
        <div class="on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FF5A5F" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>单股计算</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5C6679" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z"/></svg>监控池</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5C6679" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>异动预测</div>
      </div>
      <div class="hm"><i></i></div>
    </div></div>
  </figure>

  <!-- B2 -->
  <figure class="shot">
    <div class="cap"><b>B2</b>单股计算 · 状态仪表与四项预警</div>
    <p class="note">核心差异：整页以「风险仪表 Hero」开头——环形进度显示当前偏离占阈值的比例，中心大数字 + 状态文字 + 光晕。四项预警折叠为 2 张图形卡（进度条 + 触发价），弱化数字表格。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#E8ECF4"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#E8ECF4"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#E8ECF4"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#5C6679"/></svg>
        <svg width="16" height="11"><rect x="0" y="2" width="13" height="7" rx="2" fill="none" stroke="#E8ECF4"/><rect x="1.5" y="3.5" width="9" height="4" rx="1" fill="#E8ECF4"/><rect x="14.5" y="4" width="1.5" height="3" rx=".5" fill="#E8ECF4"/></svg>
      </span></div>
      <div class="nb">单股计算<span class="rt">规则</span></div>
      <div class="body">
        <div style="padding:10px 14px">
          <div class="row" style="background:#141922;border:1px solid #232A38;border-radius:12px;height:40px;padding:0 12px;gap:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A94A8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span style="font-size:14px" class="b">比亚迪</span><span class="tag t-gy mono">002594</span>
            <span style="flex:1"></span><span class="t3">×</span>
          </div>
        </div>
        <div style="padding:6px 14px 12px" class="btw">
          <div><div style="font-size:19px" class="b">比亚迪</div><div class="t3" style="margin-top:3px">002594 · 深交所主板</div></div>
          <div style="text-align:right"><div style="font-size:26px" class="b up num">342.15</div><div style="font-size:13px" class="up num b">+9.98%</div></div>
        </div>
        <div style="margin:0 14px;background:linear-gradient(160deg,#2A1216,#141922);border:1px solid #4A2320;border-radius:18px;padding:16px;box-shadow:0 0 30px rgba(255,59,48,.20)">
          <div class="row" style="gap:14px">
            <svg width="104" height="104" viewBox="0 0 104 104">
              <defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B4A"/><stop offset="1" stop-color="#FF3B30"/></linearGradient></defs>
              <circle cx="52" cy="52" r="42" fill="none" stroke="#2A1A1C" stroke-width="9"/>
              <circle cx="52" cy="52" r="42" fill="none" stroke="url(#gb)" stroke-width="9" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90 52 52)"/>
              <circle cx="52" cy="52" r="30" fill="none" stroke="#2A1A1C" stroke-width="5"/>

            </svg>
            <div style="flex:1">
              <div class="tag t-30" style="font-size:11px;padding:5px 8px">30日严重异常</div>

              <div class="t2" style="margin-top:6px">已超出 <b class="num up">3.11</b> 个百分点</div>
            </div>
          </div>

  <!-- B3 -->
