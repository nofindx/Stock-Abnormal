<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>异动查查 · 方案A 简约效率 · 全页面（12 屏）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F7F8FA;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.wrap{max-width:1300px;margin:0 auto;padding:36px 24px 72px}
.hd{margin-bottom:8px}
.hd h1{font-size:26px;letter-spacing:-.3px}
.hd h1 em{font-style:normal;background:#1A1A1A;color:#fff;padding:3px 10px;border-radius:4px;margin-right:10px;font-size:19px}
.hd p{font-size:13px;color:#6B7280;margin-top:8px;line-height:1.75;max-width:900px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 30px}
.legend span{font-size:11px;color:#4B5563;background:#fff;border:1px solid #E5E7EB;border-radius:4px;padding:5px 9px;display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px}
.shot{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 16px 14px}
.cap{font-size:13px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.cap b{background:#1A1A1A;color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600;letter-spacing:.5px}
.note{font-size:11px;color:#6B7280;line-height:1.65;margin:0 0 12px}
.phonebox{display:flex;justify-content:center}

/* ---------- 手机外壳 ---------- */
.phone{width:375px;height:780px;border-radius:26px;overflow:hidden;position:relative;background:#F2F3F5;
  box-shadow:0 8px 28px rgba(16,24,40,.10);border:1px solid #DCDFE5;display:flex;flex-direction:column}
.sb{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font-size:12px;font-weight:600;background:#fff;color:#1A1A1A}
.sb .r{display:flex;align-items:center;gap:5px}
.sb svg{display:block}
.nb{height:44px;flex:0 0 44px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;border-bottom:1px solid #EBEDF0}
.nb .bk{position:absolute;left:12px;top:10px;width:24px;height:24px}
.nb .rt{position:absolute;right:12px;top:12px;font-size:13px;font-weight:500;color:#4B5563}
.body{flex:1;overflow:hidden;position:relative;background:#F2F3F5}
.tb{height:56px;flex:0 0 56px;background:#fff;border-top:1px solid #EBEDF0;display:flex}
.tb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#9CA3AF}
.tb div.on{color:#1A1A1A;font-weight:600}
.hm{height:34px;flex:0 0 34px;background:#fff;display:flex;align-items:center;justify-content:center}
.hm i{width:134px;height:5px;border-radius:3px;background:#1A1A1A;display:block}

/* ---------- 通用原子 ---------- */
.pad{padding:12px 14px}
.card{background:#fff;border:1px solid #EBEDF0;border-radius:4px}
.row{display:flex;align-items:center}
.btw{display:flex;align-items:center;justify-content:space-between}
.t1{font-size:14px;color:#1A1A1A}
.t2{font-size:12px;color:#6B7280}
.t3{font-size:11px;color:#9CA3AF}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:#D93025}.down{color:#0E9F6E}
.b{font-weight:600}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tag{font-size:10px;line-height:1;padding:3px 5px;border-radius:2px;font-weight:600;white-space:nowrap}
.t-30{background:#C0271E;color:#fff}
.t-10{background:#E0501F;color:#fff}
.t-same{background:#E8890C;color:#fff}
.t-ord{background:#8A6D0B;color:#fff}
.t-safe{background:#128A5F;color:#fff}
.t-unk{background:#6B7280;color:#fff}
.t-gy{background:#F2F3F5;color:#6B7280}
.t-st{background:#fff;color:#C0271E;border:1px solid #C0271E}
.seg{display:flex;background:#F2F3F5;border-radius:4px;padding:2px}
.seg span{flex:1;text-align:center;font-size:13px;padding:6px 0;color:#6B7280;border-radius:3px}
.seg span.on{background:#fff;color:#1A1A1A;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chips{display:flex;gap:6px;overflow:hidden}
.chip{font-size:11px;padding:5px 9px;border:1px solid #E5E7EB;border-radius:3px;color:#4B5563;background:#fff;white-space:nowrap}
.chip.on{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.bar{height:4px;background:#F2F3F5;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.hr{height:1px;background:#EBEDF0}
.badge-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.disc{font-size:10px;color:#9CA3AF;text-align:center;line-height:1.6;padding:8px 0}
.btn{background:#1A1A1A;color:#fff;font-size:13px;border-radius:4px;padding:8px 14px;font-weight:600}
.btn.gh{background:#fff;color:#1A1A1A;border:1px solid #DCDFE5}
.fade{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(180deg,rgba(242,243,245,0),rgba(242,243,245,.96))}
input.f{background:#F7F8FA;border:1px solid #DCDFE5;border-radius:3px;font-size:12px;padding:0 6px;height:28px;color:#1A1A1A;text-align:right;font-variant-numeric:tabular-nums;width:100%}
input.f.err{border-color:#C0271E;background:#FDF3F2}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1><em>方案 A</em>简约效率 · 清单流</h1>
    <p>浅色、零装饰、高密度：所有页面由「筛选条 + 紧凑列表行 + 数据表格」构成，用 1px 分割线代替卡片与阴影，数字全部等宽对齐。面向盘中快速核查的熟练用户，单屏信息量最大、操作路径最短。以下 12 屏覆盖三个 Tab 的正常态与全部异常态。</p>
  </div>
  <div class="legend">
    <span><i style="background:#C0271E"></i>30 日严重异常</span>
    <span><i style="background:#E0501F"></i>10 日严重异常</span>
    <span><i style="background:#E8890C"></i>同向严重异常</span>
    <span><i style="background:#8A6D0B"></i>普通风险提示</span>
    <span><i style="background:#128A5F"></i>安全</span>
    <span><i style="background:#6B7280"></i>数据不可判定</span>
    <span><i style="background:#D93025"></i>涨（红）</span>
    <span><i style="background:#0E9F6E"></i>跌（绿）</span>
  </div>

  <div class="grid">

  <!-- ============ S1 ============ -->

    <p class="note">输入 1 个字符即请求（250ms 防抖）；下拉首屏固定 5 条，按「完整代码 &gt; 代码前缀 &gt; 完整名称 &gt; 名称包含」排序；超过 5 条只提示继续输入，不加载第二屏。每行含名称/代码/交易所/板块/ST 标签。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#1A1A1A"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1A1A"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1A1A"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#1A1A1A"/></svg>
        <svg width="16" height="11"><rect x="0" y="2" width="13" height="7" rx="2" fill="none" stroke="#1A1A1A"/><rect x="1.5" y="3.5" width="9" height="4" rx="1" fill="#1A1A1A"/><rect x="14.5" y="4" width="1.5" height="3" rx=".5" fill="#1A1A1A"/></svg>
      </span></div>
      <div class="nb">单股计算<span class="rt">规则</span></div>
      <div class="body">
        <div style="background:#fff;padding:10px 14px;border-bottom:1px solid #EBEDF0">
          <div class="row" style="background:#F7F8FA;border:1px solid #1A1A1A;border-radius:4px;height:38px;padding:0 10px;gap:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span style="font-size:15px" class="b">3007</span>
            <span style="width:1px;height:14px;background:#1A1A1A;display:inline-block"></span>
            <span class="t3" style="flex:1">输入代码 / 名称 / 简称</span>
          </div>
        </div>
        <div style="background:#fff;margin:0 14px;border:1px solid #DCDFE5;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.08)">
          <div class="row" style="padding:9px 10px;border-bottom:1px solid #EBEDF0;gap:6px">
            <span class="b" style="font-size:14px">宁德时代</span><span class="tag t-gy mono">300750</span><span class="t3">深交所 · 创业板</span>
          </div>
          <div class="row" style="padding:9px 10px;border-bottom:1px solid #EBEDF0;gap:6px">
            <span class="b" style="font-size:14px">康龙化成</span><span class="tag t-gy mono">300759</span><span class="t3">深交所 · 创业板</span>
          </div>
          <div class="row" style="padding:9px 10px;border-bottom:1px solid #EBEDF0;gap:6px">
            <span class="b" style="font-size:14px">迈瑞医疗</span><span class="tag t-gy mono">300760</span><span class="t3">深交所 · 创业板</span>
          </div>
          <div class="row" style="padding:9px 10px;border-bottom:1px solid #EBEDF0;gap:6px">
            <span class="b" style="font-size:14px">德方纳米</span><span class="tag t-gy mono">300769</span><span class="t3">深交所 · 创业板</span>
          </div>
          <div class="row" style="padding:9px 10px;gap:6px">
            <span class="b" style="font-size:14px">左江科技</span><span class="tag t-st">*ST</span><span class="tag t-gy mono">300799</span><span class="t3">深交所 · 创业板</span>
          </div>
          <div style="padding:7px 10px;background:#F7F8FA;font-size:11px;color:#9CA3AF;border-top:1px solid #EBEDF0">继续输入以缩小范围</div>
        </div>
        <div class="pad">
          <div class="card" style="padding:16px 14px;text-align:center">
            <div class="t2" style="margin-bottom:6px">未选择股票</div>
            <div class="t3">搜索并选择一只 A 股，查看当前异动状态与 T+1 ~ T+10 假设计算</div>
          </div>
        </div>
        <div class="disc">仅供参考，不构成投资建议</div>
      </div>
      <div class="tb">
        <div class="on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>单股计算</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z"/></svg>监控池</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>异动预测</div>
      </div>
      <div class="hm"><i></i></div>
    </div></div>
  </figure>

  <!-- ============ S2 ============ -->
  <figure class="shot">
    <div class="cap"><b>S2</b>单股计算 · 当前状态与四项预警</div>
    <p class="note">状态按优先级只显示一个；风险用「色块 + 文字」双通道。四项预警用同构的 4 行清单：当前偏离 / 阈值 / 触发价 / 剩余空间 + 细进度条，全部等宽数字右对齐，便于纵向扫读对比。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#1A1A1A"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1A1A"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1A1A"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#1A1A1A"/></svg>
        <svg width="16" height="11"><rect x="0" y="2" width="13" height="7" rx="2" fill="none" stroke="#1A1A1A"/><rect x="1.5" y="3.5" width="9" height="4" rx="1" fill="#1A1A1A"/><rect x="14.5" y="4" width="1.5" height="3" rx=".5" fill="#1A1A1A"/></svg>
      </span></div>
      <div class="nb">单股计算<span class="rt">规则</span></div>
      <div class="body">
        <div style="background:#fff;padding:10px 14px;border-bottom:1px solid #EBEDF0">
          <div class="row" style="background:#F7F8FA;border:1px solid #DCDFE5;border-radius:4px;height:38px;padding:0 10px;gap:8px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span style="font-size:14px" class="b">宁德时代</span><span class="tag t-gy mono">300750</span>
            <span style="flex:1"></span><span class="t3">×</span>
          </div>
        </div>
        <div style="background:#fff;padding:12px 14px;border-bottom:1px solid #EBEDF0">
          <div class="btw">
            <div class="row" style="gap:8px"><span style="font-size:17px" class="b">宁德时代</span><span class="tag t-gy mono">300750</span></div>
            <div style="text-align:right"><div style="font-size:20px" class="b up num">268.40</div><div style="font-size:12px" class="up num b">+7.82%</div></div>
          </div>
          <div class="btw" style="margin-top:6px">
            <span class="t3">深交所 · 创业板</span>
            <span class="t3">行情 14:52 <span class="tag t-safe" style="margin-left:4px">实时</span></span>
          </div>
        </div>
        <div style="background:#FDF3F2;border-left:4px solid #E0501F;padding:10px 14px">
          <div class="btw"><span class="tag t-10">10日严重异常</span><span class="t3">规则版本 2026-07-06</span></div>
          <div style="font-size:12px;color:#4B5563;margin-top:6px;line-height:1.6">10 日累计偏离 <b class="num">+103.42%</b>，已超过上涨阈值 <b class="num">+100%</b>；最近 10 个交易日内同向普通异动 3 次（创业板要求 3 次）。</div>
        </div>
        <div class="pad" style="padding-bottom:0">
          <div class="btw" style="margin-bottom:8px"><span class="t2 b">四项预警</span><span class="t3">单位：%</span></div>
          <div class="card">
            <div style="padding:10px 12px;border-bottom:1px solid #EBEDF0">
              <div class="btw"><span class="b" style="font-size:13px">3 日偏离</span><span class="t3">11/18 ~ 11/20</span></div>
              <div class="btw" style="margin-top:6px">
                <span class="t2">当前 <b class="num" style="color:#1A1A1A;font-size:14px">+18.62</b> / 阈值 <b>±30</b></span>
                <span class="t2">距阈值 <b class="num">11.38</b> 触发价 <b class="num">291.35</b></span>
              </div>
              <div class="bar" style="margin-top:7px"><i style="width:62%;background:#E8890C"></i></div>
            </div>
            <div style="padding:10px 12px;border-bottom:1px solid #EBEDF0;background:#FFFCF8">
              <div class="btw"><span class="b" style="font-size:13px">10 日偏离</span><span class="tag t-10">已触发</span></div>
              <div class="btw" style="margin-top:6px">
                <span class="t2">当前 <b class="num" style="color:#E0501F;font-size:14px">+103.42</b> / 阈值 <b>+100 / -50</b></span>

  <!-- ============ S3 ============ -->
  <figure class="shot">
    <div class="cap"><b>S3</b>单股计算 · T+1 ~ T+10 假设表</div>
    <p class="note">时间为行、指标为列，横向滚动；只生成交易日，非交易日不出现。输入失焦/回车即本地重算（100ms 内，不重新请求历史行情），空值按 0% 参与计算但输入框保持为空。非法输入只影响该行，字段级红框提示。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#1A1A1A"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1A1A"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1A1A"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#1A1A1A"/></svg>

      </span></div>
      <div class="nb">T+N 假设计算<span class="bk" style="top:12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></span><span class="rt">规则</span></div>
      <div class="body">
        <div style="background:#fff;padding:10px 14px;border-bottom:1px solid #EBEDF0" class="btw">
          <div class="row" style="gap:8px"><span class="b" style="font-size:14px">宁德时代</span><span class="tag t-gy mono">300750</span><span class="tag t-10">10日严重异常</span></div>
        </div>
