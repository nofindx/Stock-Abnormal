<style>

.nb .bk{position:absolute;left:12px;top:10px;width:24px;height:24px}

.body{flex:1;overflow:hidden;position:relative;background:#F4F6F9}

.t-10{background:#FDF0E8;color:#C2521F;border:1px solid #F6DCC8}
.t-same{background:#FDF5E3;color:#8A6107;border:1px solid #F2E4C4}
.t-ord{background:#FCF7E6;color:#7A5F08;border:1px solid #EFE6C8}
.t-safe{background:#E8F5F0;color:#0E7A5F;border:1px solid #CFE9E0}
.t-unk{background:#EEF2F6;color:#5A6B7C;border:1px solid #E1E7EE}
.t-gy{background:#EEF2F6;color:#5A6B7C}

.seg span{flex:1;text-align:center;font-size:13px;padding:7px 0;color:#5A6B7C;border-radius:10px}
.seg span.on{background:#fff;color:#0F7B8A;font-weight:600;box-shadow:0 1px 4px rgba(16,32,48,.10)}
.chips{display:flex;gap:6px;overflow:hidden}
.chip{font-size:11px;padding:6px 11px;border:1px solid #E1E7EE;border-radius:20px;color:#5A6B7C;background:#fff;white-space:nowrap}

.btn{background:#0F7B8A;color:#fff;font-size:13px;border-radius:10px;padding:8px 14px;font-weight:600}
.btn.gh{background:#fff;color:#0F7B8A;border:1px solid #CFE0E4}

input.f.err{border-color:#B3251E;background:#FDF3F2}

.sec{font-size:11px;color:#93A1B0;letter-spacing:.4px;font-weight:600;padding:0 14px 7px;display:flex;align-items:center;gap:6px}
.sec i{width:3px;height:11px;background:#0F7B8A;border-radius:2px;display:inline-block}

<body>
<div class="wrap">
  <div class="hd">
    <h1><em>方案 C</em>内容导向 · 解释型卡片</h1>
    <p>把「结论」翻译成「人话」：每个状态、每项预警都配一句话白话解读与「这是什么意思」的渐进披露；预测列表按「已触发 / 临界 / 安全」分组而不是平铺。面向刚接触异动规则、需要理解为什么的用户，也是合规风险最低的一版。代价是页面更长、信息密度最低。</p>
  </div>
  <div class="legend">
    <span><i style="background:#B3251E"></i>30 日严重异常</span>
    <span><i style="background:#C2521F"></i>10 日严重异常</span>
    <span><i style="background:#8A6107"></i>同向严重异常</span>
    <span><i style="background:#7A5F08"></i>普通风险提示</span>
    <span><i style="background:#0E7A5F"></i>安全</span>
    <span><i style="background:#5A6B7C"></i>数据不可判定</span>
    <span><i style="background:#D93025"></i>涨（红）</span>
    <span><i style="background:#0E9F6E"></i>跌（绿）</span>
  </div>

  <div class="grid">

  <!-- C1 -->
  <figure class="shot">
    <div class="cap"><b>C1</b>单股计算 · 搜索与首次引导</div>
    <p class="note">搜索结果除基础字段外，增加一行「板块决定阈值」的提示，让用户在选股时就理解板块差异。未选股时用引导卡解释本页会给出什么，而不是空白页。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#16202B"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#16202B"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#16202B"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#16202B"/></svg>
        <svg width="16" height="11"><rect x="0" y="2" width="13" height="7" rx="2" fill="none" stroke="#16202B"/><rect x="1.5" y="3.5" width="9" height="4" rx="1" fill="#16202B"/><rect x="14.5" y="4" width="1.5" height="3" rx=".5" fill="#16202B"/></svg>
      </span></div>
      <div class="nb">单股计算<span class="rt">规则说明</span></div>
      <div class="body">
        <div style="background:#fff;padding:12px 14px;border-bottom:1px solid #EDF1F5">
          <div class="row" style="background:#F8FAFB;border:1px solid #0F7B8A;border-radius:12px;height:42px;padding:0 12px;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span style="font-size:15px" class="b">6005</span>
            <span style="flex:1"></span><span class="t3">清空</span>
          </div>
        </div>
        <div style="background:#fff;margin:0 14px;border:1px solid #DCE4EA;border-radius:14px;box-shadow:0 6px 18px rgba(16,32,48,.08);overflow:hidden">
          <div style="padding:11px 12px;border-bottom:1px solid #EDF1F5">
            <div class="row" style="gap:7px"><span class="b" style="font-size:15px">贵州茅台</span><span class="tag t-gy mono">600519</span></div>
            <div class="t3" style="margin-top:4px">上交所 · 主板 · 3 日阈值 ±20% · 同向 4 次</div>
          </div>
          <div style="padding:11px 12px;border-bottom:1px solid #EDF1F5">
            <div class="row" style="gap:7px"><span class="b" style="font-size:15px">海尔智家</span><span class="tag t-gy mono">600690</span></div>
            <div class="t3" style="margin-top:4px">上交所 · 主板 · 3 日阈值 ±20% · 同向 4 次</div>
          </div>
          <div style="padding:11px 12px;border-bottom:1px solid #EDF1F5">
            <div class="row" style="gap:7px"><span class="b" style="font-size:15px">海信视像</span><span class="tag t-gy mono">600060</span></div>
            <div class="t3" style="margin-top:4px">上交所 · 主板 · 3 日阈值 ±20% · 同向 4 次</div>
          </div>
          <div style="padding:11px 12px;border-bottom:1px solid #EDF1F5">
            <div class="row" style="gap:7px"><span class="b" style="font-size:15px">中航沈飞</span><span class="tag t-gy mono">600760</span></div>
            <div class="t3" style="margin-top:4px">上交所 · 主板 · 3 日阈值 ±20% · 同向 4 次</div>
          </div>
          <div style="padding:11px 12px">
            <div class="row" style="gap:7px"><span class="b" style="font-size:15px">ST 沪科</span><span class="tag t-st">ST</span><span class="tag t-gy mono">600608</span></div>
            <div class="t3" style="margin-top:4px">上交所 · 主板 · ST 单独维护阈值</div>
          </div>
          <div style="padding:9px 12px;background:#F8FAFB;font-size:11px;color:#93A1B0;border-top:1px solid #EDF1F5">继续输入以缩小范围</div>
        </div>
        <div class="pad">
          <div class="card" style="padding:18px 16px">
            <div class="row" style="gap:8px;margin-bottom:10px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F7B8A" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8.5v.5"/></svg>
              <span class="b" style="font-size:14px">这只票现在是什么状态？</span>
            </div>
            <div class="read">选中股票后，我会按交易所规则算出：<br>① 当前属于哪一档状态；② 四项预警各自离阈值还有多远；③ 如果你假设未来 10 天的涨跌，会走到哪里。</div>
            <div class="why">规则来自上交所 / 深交所 2026 年修订版，阈值由后端下发，页面不写死数字。</div>
          </div>
        </div>
        <div class="disc">仅供参考，不构成投资建议</div>
      </div>
      <div class="tb">
        <div class="on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0F7B8A" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>单股计算</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z"/></svg>监控池</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>异动预测</div>
      </div>
      <div class="hm"><i></i></div>
    </div></div>
  </figure>

  <!-- C2 -->
  <figure class="shot">
    <div class="cap"><b>C2</b>单股计算 · 结论卡与四项解读</div>
    <p class="note">核心差异：状态卡先给「一句话结论」，再给「怎么算出来的」可展开区；四项预警每张卡都有白话解读条（灰底）+ 阈值刻度条，用户不必懂规则也能读懂。</p>
    <div class="phonebox"><div class="phone">
      <div class="sb"><span>9:41</span><span class="r">
        <svg width="17" height="11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#16202B"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#16202B"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#16202B"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#16202B"/></svg>
        <svg width="16" height="11"><rect x="0" y="2" width="13" height="7" rx="2" fill="none" stroke="#16202B"/><rect x="1.5" y="3.5" width="9" height="4" rx="1" fill="#16202B"/><rect x="14.5" y="4" width="1.5" height="3" rx=".5" fill="#16202B"/></svg>
      </span></div>
      <div class="nb">单股计算<span class="rt">规则说明</span></div>
      <div class="body">
        <div style="background:#fff;padding:12px 14px;border-bottom:1px solid #EDF1F5">
          <div class="row" style="background:#F8FAFB;border:1px solid #DCE4EA;border-radius:12px;height:42px;padding:0 12px;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span style="font-size:15px" class="b">贵州茅台</span><span class="tag t-gy mono">600519</span>
            <span style="flex:1"></span><span class="t3">切换</span>
          </div>
        </div>
        <div class="pad" style="padding-bottom:8px">
          <div class="card" style="padding:14px">
            <div class="btw">
              <div><div style="font-size:17px" class="b">贵州茅台</div><div class="t3" style="margin-top:3px">600519 · 上交所主板</div></div>
              <div style="text-align:right"><div style="font-size:20px" class="b down num">1523.00</div><div style="font-size:12px" class="down num b">-0.62%</div></div>
            </div>
            <div class="hr" style="margin:12px 0"></div>
            <div class="row" style="gap:9px">
              <span class="tag t-safe" style="font-size:11px;padding:5px 8px">安全</span>
              <span class="read" style="flex:1">四项指标都还没碰到规则线，目前不需要特别关注。</span>
            </div>
            <div class="why" style="margin-top:10px">
              <b>怎么判断的？</b>状态按「30日严重 &gt; 10日严重 &gt; 同向严重 &gt; 普通提示 &gt; 安全 &gt; 数据不可判定」取最高一档。本股最高一档为「安全」。
            </div>
            <div class="btw" style="margin-top:11px">
              <span class="t3">行情 14:52 · <span class="tag t-safe">实时</span></span>
              <span class="t3" style="color:#0F7B8A">查看规则原文 ›</span>
            </div>
          </div>
        </div>
        <div class="sec"><i></i>四项预警 · 离规则线还有多远</div>
        <div class="pad" style="padding-top:0">
          <div class="card" style="padding:13px;margin-bottom:9px">
            <div class="btw"><span class="b" style="font-size:13px">3 日偏离</span><span class="t3">11/18 ~ 11/20</span></div>
            <div class="btw" style="margin-top:7px"><span class="t2">当前 <b class="num" style="font-size:15px">-1.84%</b></span><span class="t2">阈值 <b>±30%</b></span></div>
            <div class="bar" style="margin-top:8px"><i style="width:6%;background:#0E7A5F"></i></div>
            <div class="read" style="margin-top:9px;background:#F8FAFB;border-radius:8px;padding:7px 9px">最近 3 天比指数少跌了 1.84 个百分点，离 ±20% 的线还很远。</div>
          </div>
          <div class="card" style="padding:13px;margin-bottom:9px">
            <div class="btw"><span class="b" style="font-size:13px">10 日偏离</span><span class="tag t-safe">未触发</span></div>
            <div class="btw" style="margin-top:7px"><span class="t2">当前 <b class="num" style="font-size:15px">+12.30%</b></span><span class="t2">阈值 <b>+100% / -50%</b></span></div>
            <div class="bar" style="margin-top:8px"><i style="width:12%;background:#0E7A5F"></i></div>
            <div class="read" style="margin-top:9px;background:#F8FAFB;border-radius:8px;padding:7px 9px">还要再涨约 <b class="num">87.70</b> 个百分点才碰到 +100% 的线（约 <b class="num">2854.60</b> 元）。</div>
          </div>
          <div class="card" style="padding:13px;margin-bottom:9px">
            <div class="btw"><span class="b" style="font-size:13px">30 日偏离</span><span class="tag t-safe">未触发</span></div>
            <div class="btw" style="margin-top:7px"><span class="t2">当前 <b class="num" style="font-size:15px">+26.70%</b></span><span class="t2">阈值 <b>+200% / -70%</b></span></div>
            <div class="bar" style="margin-top:8px"><i style="width:13%;background:#0E7A5F"></i></div>
            <div class="read" style="margin-top:9px;background:#F8FAFB;border-radius:8px;padding:7px 9px">距离 +200% 还差 <b class="num">173.30</b>，短期内不会触及。</div>
          </div>
          <div class="card" style="padding:13px">
            <div class="btw"><span class="b" style="font-size:13px">10 日同向异动</span><span class="tag t-safe">0 / 4</span></div>
            <div class="btw" style="margin-top:7px"><span class="t2">同向 <b class="num" style="font-size:15px">0</b> 次</span><span class="t2">上交所主板要求 <b>4</b> 次</span></div>
            <div class="read" style="margin-top:9px;background:#F8FAFB;border-radius:8px;padding:7px 9px">最近 10 个交易日没有出现过同方向的普通异动。</div>
          </div>
        </div>
        <div class="disc">数据更新 14:52 · 仅供参考，不构成投资建议</div>
        <div class="fade"></div>
      </div>
      <div class="tb">
        <div class="on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0F7B8A" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>单股计算</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z"/></svg>监控池</div>
        <div><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#93A1B0" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>异动预测</div>
      </div>
      <div class="hm"><i></i></div>
    </div></div>
  </figure>

  <!-- C3 -->
  <figure class="shot">
    <div class="cap"><b>C3</b>单股计算 · T+N 分步推演</div>
